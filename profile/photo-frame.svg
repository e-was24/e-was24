<svg width="260" height="260" viewBox="0 0 260 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="circleClip">
      <circle cx="130" cy="130" r="88"/>
    </clipPath>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8FD9FF"/>
      <stop offset="100%" stop-color="#39FF14"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="80%" stop-color="#8FD9FF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#8FD9FF" stop-opacity="0.25"/>
    </radialGradient>
  </defs>

  <!-- background glow -->
  <circle cx="130" cy="130" r="128" fill="url(#glow)"/>

  <!-- outer faint static ring -->
  <circle cx="130" cy="130" r="122" fill="none" stroke="#1b2735" stroke-width="1.5"/>

  <!-- rotating dashed scanner ring -->
  <circle cx="130" cy="130" r="112" fill="none" stroke="url(#ringGrad)" stroke-width="2" stroke-dasharray="4 9" stroke-linecap="round" opacity="0.85">
    <animateTransform attributeName="transform" type="rotate" from="0 130 130" to="360 130 130" dur="10s" repeatCount="indefinite"/>
  </circle>

  <!-- counter-rotating thin ring with ticks -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="360 130 130" to="0 130 130" dur="16s" repeatCount="indefinite"/>
    <circle cx="130" cy="130" r="100" fill="none" stroke="#8FD9FF" stroke-width="1" opacity="0.35"/>
    <circle cx="130" cy="30" r="2.5" fill="#8FD9FF"/>
    <circle cx="130" cy="230" r="2.5" fill="#8FD9FF"/>
    <circle cx="30" cy="130" r="2.5" fill="#8FD9FF"/>
    <circle cx="230" cy="130" r="2.5" fill="#8FD9FF"/>
  </g>

  <!-- HUD corner brackets -->
  <g stroke="#8FD9FF" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M8,28 L8,8 L28,8"/>
    <path d="M232,8 L252,8 L252,28"/>
    <path d="M252,232 L252,252 L232,252"/>
    <path d="M28,252 L8,252 L8,232"/>
  </g>

  <!-- photo, clipped to circle -->
  <image href="https://raw.githubusercontent.com/e-was24/e-was24/main/profile/profile_github.jpeg"
         x="42" y="42" width="176" height="176"
         clip-path="url(#circleClip)"
         preserveAspectRatio="xMidYMid slice"/>

  <!-- inner border on photo -->
  <circle cx="130" cy="130" r="88" fill="none" stroke="#0a0e17" stroke-width="4"/>
  <circle cx="130" cy="130" r="88" fill="none" stroke="#8FD9FF" stroke-width="2"/>

  <!-- status indicator, bottom-right -->
  <circle cx="205" cy="205" r="12" fill="#0a0e17" stroke="#8FD9FF" stroke-width="2"/>
  <circle cx="205" cy="205" r="5" fill="#39FF14">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
</svg>
